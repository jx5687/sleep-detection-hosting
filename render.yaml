services:
  - type: web
    name: drowsyguard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SLEEP_MODEL_PATH
        value: sleep_detection_model.h5